<footer style="background-color: var(--color-navbar); color: white; padding: 20px; text-align: center; margin-top: 40px;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div style="flex: 1;">
                <h5 style="margin: 0; font-weight: 500;">Viixen</h5>
                <p style="margin: 5px 0 0 0; opacity: 0.8;">Sistema de gerenciamento empresarial.</p>
            </div>
            <div style="flex: 1; text-align: right;">
                <p style="margin: 0; opacity: 0.8;">&copy; 2025 Viixen. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleTheme');
        toggleBtn.addEventListener('click', () => {
          document.body.classList.toggle('dark-theme');
          localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        });
      
        // Aplicar tema salvo ou detectar tema do sistema
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          if (savedTheme === 'dark') document.body.classList.add('dark-theme');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add('dark-theme');
        }
      </script>
      
</footer>

{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Viixen{% endblock %}</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- Fonte Ubuntu + Tema -->
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/yaru-theme.css' %}">
<!-- Cores Harmonizadas -->
<link rel="stylesheet" href="{% static 'css/harmonized-colors.css' %}">
<!-- Correções de Cores -->
<link rel="stylesheet" href="{% static 'css/color-fixes.css' %}">
<!-- Sistema de Notificações Ubuntu -->
<link rel="stylesheet" href="{% static 'css/notifications.css' %}">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/yaru-animations.js' %}" defer></script>
<script src="{% static 'js/notifications.js' %}" defer></script>
<script src="{% static 'js/mobile-menu.js' %}" defer></script>
<script src="{% static 'js/login-handler.js' %}" defer></script>

{% extends 'base.html' %}

{% block title %}Cadastro - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Cadastro</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="id_first_name" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="id_first_name" name="first_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="id_last_name" class="form-label">Sobrenome</label>
                            <input type="text" class="form-control" id="id_last_name" name="last_name" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="id_username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="id_email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_phone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="id_phone" name="phone">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="id_password1" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="id_password1" name="password1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="id_password2" class="form-label">Confirmar Senha</label>
                            <input type="password" class="form-control" id="id_password2" name="password2" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'accounts:login' %}">Já tem conta? Faça login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

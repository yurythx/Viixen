{% extends "base.html" %}
{% load i18n %}
{% load allauth %}

{% block title %}Login Cancelado{% endblock %}

{% block content %}
    <div class="login-cancelled-container">
        <div class="info-icon">
            <i class="fas fa-info-circle"></i>
        </div>
        <h2>Login Cancelado</h2>
        <p class="info-message">Você decidiu cancelar o login em nosso site usando uma de suas contas existentes.</p>

        <div class="info-actions">
            <a href="{% url 'accounts:login' %}" class="btn">
                <i class="fas fa-sign-in-alt"></i> Fazer Login
            </a>
        </div>
    </div>
{% endblock %}
